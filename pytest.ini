[pytest]
# Match ROADMAP packages without installing the repo.
asyncio_mode = auto
pythonpath =
    audio-intelligence
    signal-processing
    shared/mocks
    modes
    backend
testpaths =
    audio-intelligence/tests
    signal-processing/tests
    modes/practice/tests
    modes/integration/tests
    backend/tests
norecursedirs =
    platform
    .git
    .venv
